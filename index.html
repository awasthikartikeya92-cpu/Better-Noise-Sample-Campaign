<title>Rate your IRONVEIL obsession</title>

<style>
  :root {
    --bg: #0A0A0A;
    --bg-panel: #141414;
    --white: #FFFFFF;
    --off: #C9C9C9;
    --muted: #7A7A7A;
    --red: #E01B22;
    --red-deep: #A3131A;
    --line: rgba(255,255,255,0.14);
    --line-strong: rgba(255,255,255,0.28);
    --hazard: repeating-linear-gradient(135deg, var(--red) 0 10px, #000 10px 20px);
  }
  /* Brand is fixed black/white/red by design: the label's identity doesn't
     flip to a pale palette when a viewer's system is in light mode, so the
     light-mode override below intentionally repeats the same dark values
     rather than substituting a lighter theme. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0A0A0A; }
  }
  :root[data-theme="light"] {
    --bg: #0A0A0A;
    --bg-panel: #141414;
    --white: #FFFFFF;
    --off: #C9C9C9;
    --muted: #7A7A7A;
    --line: rgba(255,255,255,0.14);
    --line-strong: rgba(255,255,255,0.28);
  }
  :root[data-theme="dark"] {
    --bg: #0A0A0A;
    --bg-panel: #141414;
    --white: #FFFFFF;
    --off: #C9C9C9;
    --muted: #7A7A7A;
    --line: rgba(255,255,255,0.14);
    --line-strong: rgba(255,255,255,0.28);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0 0 80px;
  }

  .wrap { width: 100%; max-width: 620px; }

  .imgph {
    position: relative;
    background: var(--bg-panel);
    border: 1px solid var(--line-strong);
    overflow: hidden;
  }
  .imgph::before {
    content: "";
    position: absolute; inset: 0;
    background: var(--hazard);
    opacity: 0.16;
  }
  .imgph .corner {
    position: absolute; z-index: 2; width: 16px; height: 16px;
    border-color: var(--red); border-style: solid; border-width: 0;
  }
  .imgph .c-tl { top: 10px; left: 10px; border-top-width: 2px; border-left-width: 2px; }
  .imgph .c-tr { top: 10px; right: 10px; border-top-width: 2px; border-right-width: 2px; }
  .imgph .c-bl { bottom: 10px; left: 10px; border-bottom-width: 2px; border-left-width: 2px; }
  .imgph .c-br { bottom: 10px; right: 10px; border-bottom-width: 2px; border-right-width: 2px; }
  .imgph .cap {
    position: absolute; z-index: 2; left: 10px; bottom: 10px; right: 34px;
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--off); font-weight: 700;
    background: rgba(10,10,10,0.82); padding: 3px 6px; border: 1px solid var(--line-strong);
  }

  .hero .imgph { position: absolute; inset: 0; border: 0; }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(10,10,10,0.42) 0%, rgba(10,10,10,0.55) 30%, rgba(10,10,10,0.86) 62%, rgba(10,10,10,0.97) 100%);
  }

  .hero-wrap { position: relative; z-index: 3; }

  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 10px;
  }

  h1.headline {
    font-family: 'Anton', 'Arial Narrow', sans-serif;
    text-transform: uppercase;
    font-size: clamp(34px, 8.4vw, 52px);
    line-height: 0.96;
    letter-spacing: 0.005em;
    margin: 0 0 14px;
  }

  p.sub {
    color: var(--off);
    font-size: 15px;
    line-height: 1.55;
    max-width: 420px;
    margin: 0 0 20px;
  }

  .content-pad { padding: 26px 22px 0; }

  .btn {
    display: block;
    width: 100%;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 2px;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 16px 20px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .btn:hover { background: var(--red-deep); }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--white);
    text-transform: none;
    font-weight: 600;
  }
  .btn-ghost:hover { background: var(--line); }

  .panel { background: var(--bg-panel); border: 1px solid var(--line-strong); padding: 26px 22px; margin: 0 22px; }

  .track-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .track-row span.num { color: var(--red); }

  .track-bar { height: 3px; background: var(--line); overflow: hidden; margin-bottom: 26px; }
  .track-bar-fill { height: 100%; background: var(--red); transition: width 0.35s ease; }

  .question {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 20px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }

  .option {
    text-align: left;
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 15px 16px;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .option:hover { background: var(--line); border-color: var(--red); }
  .option:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .option.selected { border-color: var(--red); background: var(--line); }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
  .nav-row .link-btn {
    background: none; border: none; color: var(--muted);
    font-family: 'Inter', sans-serif; font-size: 14px; cursor: pointer; padding: 8px 0;
  }
  .nav-row .link-btn:hover { color: var(--white); }

  .error-text { color: var(--red); font-size: 13px; margin: -8px 0 16px; min-height: 16px; }

  .pass { text-align: center; }

  .pass-photo {
    width: 96px; height: 96px;
    margin: 0 auto 18px;
    border: 2px solid var(--red);
  }

  .pass-badge {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line-strong);
    padding: 5px 14px;
    margin-bottom: 16px;
  }

  .pass-tier {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    font-size: clamp(30px, 7.4vw, 44px);
    color: var(--red);
    margin: 0 0 14px;
    line-height: 1.0;
  }

  .pass-copy { font-size: 15.5px; line-height: 1.6; color: var(--off); max-width: 440px; margin: 0 auto 28px; }

  .field {
    display: block; width: 100%;
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .field::placeholder { color: var(--muted); }
  .field:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  .confirm { text-align: center; padding: 6px 0 4px; }
  .confirm .pass-tier { font-size: clamp(24px, 6vw, 30px); }

  .footnote { text-align: center; color: var(--muted); font-size: 11px; margin: 20px 0; letter-spacing: 0.02em; }

  function next() {
    if (state.answers[state.current] === undefined) {
      state.error = "Pick an answer to keep going.";
      render();
      return;
    }
    if (state.current === QUESTIONS.length - 1) {
      state.screen = "result";
    } else {
      state.current += 1;
    }
    render();
  }

  function back() {
    if (state.current === 0) { state.screen = "intro"; render(); return; }
    state.current -= 1;
    state.error = "";
    render();
  }

  function start() {
    state.screen = "quiz";
    state.current = 0;
    state.answers = [];
    render();
  }

  function totalScore() {
    return state.answers.reduce(function (sum, a) { return sum + (a ? a.pts : 0); }, 0);
  }

  function getTier() {
    var score = totalScore();
    for (var i = 0; i < TIERS.length; i++) { if (score <= TIERS[i].max) return TIERS[i]; }
    return TIERS[TIERS.length - 1];
  }

  function submitCapture(ev) {
    ev.preventDefault();
    var name = document.getElementById("cap-name");
    var email = document.getElementById("cap-email");
    var err = document.getElementById("cap-error");
    var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
    if (!name.value.trim()) { err.textContent = "Enter your name first."; name.focus(); return; }
    if (!emailOk) { err.textContent = "Enter a valid email."; email.focus(); return; }
    err.textContent = "";
    state.capturedName = name.value.trim();
    state.screen = "confirm";
    render();
  }

  function restart() {
    state = { screen: "intro", current: 0, answers: [], error: "" };
    render();
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function render() {
    if (state.screen === "intro") {
      app.innerHTML =
        '<div class="hero">' +
        '<div class="hero-wrap">' +
        '<div class="eyebrow">Better Noise presents</div>' +
        '<h1 class="headline">Rate your<br>IRONVEIL<br>obsession</h1>' +
        '<p class="sub">Five questions. Zero judgment. Some judgment. Find your tier and get the access that comes with it.</p>' +
        '</div></div>' +
        '<div class="content-pad">' +
        '<button class="btn" id="start-btn">Start the set</button>' +
        '<p class="footnote">Takes about 30 seconds \u00b7 The First Listen Club</p>' +
        '</div>';
      document.getElementById("start-btn").addEventListener("click", start);
      return;
    }

    if (state.screen === "quiz") {
      var qi = state.current;
      var q = QUESTIONS[qi];
      var progress = Math.round(((qi) / QUESTIONS.length) * 100);
      var selected = state.answers[qi] ? state.answers[qi].idx : -1;

      var optsHtml = q.options.map(function (o, i) {
        return '<button class="option' + (selected === i ? ' selected' : '') + '" data-idx="' + i + '" data-pts="' + o.pts + '">' + esc(o.text) + '</button>';
      }).join("");

      app.innerHTML =
        '<div style="height:20px;"></div>' +
        '<div class="panel">' +
        '<div class="track-row"><span><span class="num">TRACK ' + q.track + '</span> / 0' + QUESTIONS.length + '</span><span>IRONVEIL</span></div>' +
        '<div class="track-bar"><div class="track-bar-fill" style="width:' + progress + '%"></div></div>' +
        '<p class="question">' + esc(q.q) + '</p>' +
        '<div class="options">' + optsHtml + '</div>' +
        '<div class="error-text">' + esc(state.error) + '</div>' +
        '<div class="nav-row">' +
        '<button class="link-btn" id="back-btn">Back</button>' +
        '<button class="btn" id="next-btn" style="width:auto; padding:12px 26px;">' + (qi === QUESTIONS.length - 1 ? "See result" : "Next") + '</button>' +
        '</div></div>';

      app.querySelectorAll(".option").forEach(function (btn) {
        btn.addEventListener("click", function () {
          pick(parseInt(btn.getAttribute("data-idx"), 10), parseInt(btn.getAttribute("data-pts"), 10));
        });
      });
      document.getElementById("next-btn").addEventListener("click", next);
      document.getElementById("back-btn").addEventListener("click", back);
      return;
    }

    if (state.screen === "result") {
      var tier = getTier();
      app.innerHTML =
        '<div style="height:20px;"></div>' +
        '<div class="panel pass">' +
        '<div style="width:120px;height:120px;margin:0 auto 18px;border:2px solid var(--red);background:url(\'' + LAMINATE_URI + '\') center/cover no-repeat;"></div>' +
        '<div class="pass-badge">Your result</div>' +
        '<h2 class="pass-tier">' + esc(tier.name) + '</h2>' +
        '<p class="pass-copy">' + esc(tier.copy) + '</p>' +
        '<form id="cap-form">' +
        '<input class="field" id="cap-name" type="text" placeholder="Your name" autocomplete="name" />' +
        '<input class="field" id="cap-email" type="email" placeholder="you@email.com" autocomplete="email" />' +
        '<div class="error-text" id="cap-error"></div>' +
        '<button class="btn" type="submit">' + esc(tier.cta) + '</button>' +
        '</form>' +
        '<button class="link-btn" id="restart-btn" style="margin-top:14px;">Retake the quiz</button>' +
        '</div>';
      document.getElementById("cap-form").addEventListener("submit", submitCapture);
      document.getElementById("restart-btn").addEventListener("click", restart);
      return;
    }

    if (state.screen === "confirm") {
      var tier2 = getTier();
      app.innerHTML =
        '<div style="height:20px;"></div>' +
        '<div class="panel confirm">' +
        '<div class="pass-badge">Confirmed</div>' +
        '<h2 class="pass-tier">You\'re in, ' + esc((state.capturedName || "").split(" ")[0].toUpperCase()) + '</h2>' +
        '<p class="pass-copy">You\'re on the ' + esc(tier2.name.toLowerCase()) + ' list. Watch your inbox, that\'s where it starts.</p>' +
        '<button class="btn btn-ghost" id="restart-btn-2" style="width:auto; padding:12px 26px;">Start over</button>' +
        '</div>';
      document.getElementById("restart-btn-2").addEventListener("click", restart);
      return;
    }
  }

  render();
</script>
</body>
</html>
